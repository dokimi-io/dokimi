# What the orchestrator Job needs from the cluster, and nothing more.
#
# Apply once per cluster, then submit with `--service-account dokimi`:
#
#   kubectl apply -f deploy/rbac.yaml
#   dokimi submit test.yaml --service-account dokimi
#
# This also creates the two namespaces a run needs. A run never creates a namespace, so
# without this file there is nowhere to submit to and no run-start lock.
#
# This grows as phases land. Each rule says which phase needs it and why, so the grant
# stays auditable line by line:
#
#   - phase 3 reads nodes to resolve the definition's two nodes (cluster-scoped);
#   - phase 4 begins with the run-exclusivity claim: it lists run owners in
#     every namespace, takes a Lease in the lock namespace, reads its own Job's start
#     time to date the claim's expiry, and writes its claim onto its own owner; phase 11
#     marks that owner finished, and records there whether the run keeps its evidence;
#   - phase 4 then deploys the run's managed Prometheus: it looks for an
#     already-present node-exporter or kube-state-metrics by listing Services, deploys
#     a node-exporter DaemonSet when there is none, and creates the Prometheus's
#     ConfigMap, Deployment and Service in the run namespace;
#   - phase 6 creates each pair's client and server pods and reads their status, and
#     phase 11 deletes those that may still be sending before the run releases the
#     cluster, and the node-exporter it deployed.
#
# The Job deletes nothing else. Its owner, definition and Job go after the run, removed by
# whoever fetched its reports, or by `dokimi cleanup`, with their credentials.
#
# The managed Prometheus runs as its own service account, dokimi-prometheus, created
# here rather than by a run: its discovery rights would otherwise have to be granted by
# a Job that does not hold them.
apiVersion: v1
kind: Namespace
metadata:
  name: dokimi-iperf2
  labels:
    # managed-by but no run-id: the namespace is shared by every iperf2 run, so a
    # run-scoped cleanup must never select it.
    app.kubernetes.io/managed-by: dokimi
---
# The run-start lock's namespace. One per cluster, whatever namespace a run
# uses, so that exclusivity is cluster-wide.
apiVersion: v1
kind: Namespace
metadata:
  name: dokimi
  labels:
    app.kubernetes.io/managed-by: dokimi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dokimi
  namespace: dokimi-iperf2
  labels:
    app.kubernetes.io/managed-by: dokimi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dokimi
  labels:
    app.kubernetes.io/managed-by: dokimi
rules:
  # Phase 3: discovery and explicit node resolution (M1-06).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # Phase 4: the exclusivity scan lists run owners in every namespace.
  # RBAC cannot restrict a list by label, so this reads every ConfigMap in the cluster,
  # including its data. It is the price of cluster-wide exclusivity.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["list"]
  # Phase 4: an already-present node-exporter or kube-state-metrics is reused rather
  # than duplicated, found by its Service's labels in any namespace.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dokimi
  labels:
    app.kubernetes.io/managed-by: dokimi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dokimi
subjects:
  - kind: ServiceAccount
    name: dokimi
    namespace: dokimi-iperf2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dokimi-run-lock
  namespace: dokimi
  labels:
    app.kubernetes.io/managed-by: dokimi
rules:
  # Phase 4: take, confirm, take over and release the run-start lock.
  # RBAC cannot restrict create by name, so only create is unnamed.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["dokimi-run-lock"]
    verbs: ["get", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dokimi-run-lock
  namespace: dokimi
  labels:
    app.kubernetes.io/managed-by: dokimi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dokimi-run-lock
subjects:
  - kind: ServiceAccount
    name: dokimi
    namespace: dokimi-iperf2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dokimi
  namespace: dokimi-iperf2
  labels:
    app.kubernetes.io/managed-by: dokimi
rules:
  # Phase 4 writes the claim onto the run's own owner, and phase 11 marks it finished.
  # The owner already exists: submit created it.
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
  # Phase 4 dates the claim's expiry from the Job's own start time.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
  # Phase 4 deploys the run's managed Prometheus: its configuration, its Deployment and
  # its Service. Kept after the run by default, so nothing here deletes.
  - apiGroups: [""]
    resources: ["configmaps", "services"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create"]
  # Phase 4 deploys a node-exporter DaemonSet when the cluster has none. It
  # lists the run namespace's DaemonSets first, to reuse one a crashed run left, and
  # reads the new one's status to tell whether Pod Security refused its pods. Phase 11
  # deletes the one the run deployed, before the run releases the cluster.
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["create", "get", "list", "delete"]
  # Phase 6 creates each pair's client and server pods, and reads them for the readiness
  # gate and for completion. Phase 4 does the same for the first
  # pair in probe mode, and deletes those pods before phase 5. Phase 11 lists and deletes
  # them before the run releases the cluster, so that no test can still be sending.
  # No pods/exec: a test starts over its trigger port, and completion is read
  # from the pod's status.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dokimi
  namespace: dokimi-iperf2
  labels:
    app.kubernetes.io/managed-by: dokimi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dokimi
subjects:
  - kind: ServiceAccount
    name: dokimi
    namespace: dokimi-iperf2
---
# The managed Prometheus's own identity. It discovers the run's exporter pods in the run
# namespace, and a supporting exporter's endpoints wherever that runs. Read-only.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dokimi-prometheus
  namespace: dokimi-iperf2
  labels:
    app.kubernetes.io/managed-by: dokimi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dokimi-prometheus
  labels:
    app.kubernetes.io/managed-by: dokimi
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dokimi-prometheus
  labels:
    app.kubernetes.io/managed-by: dokimi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dokimi-prometheus
subjects:
  - kind: ServiceAccount
    name: dokimi-prometheus
    namespace: dokimi-iperf2
