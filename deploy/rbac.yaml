# What the orchestrator Job needs from the cluster, and nothing more.
#
# Apply once per cluster, then submit with `--service-account test-orchestrator`:
#
#   kubectl apply -f deploy/rbac.yaml
#   test-orchestrator submit test.yaml --service-account test-orchestrator
#
# This grows as phases land. Today the Job reads nodes in phase 3 (planning) to resolve
# the definition's two nodes and check they can take a test pod. Nodes are
# cluster-scoped, which is why this is a ClusterRole rather than a namespaced Role.
#
# Deliberately read-only. Later phases add what they need, each with a comment saying
# which phase and why, so the grant stays auditable line by line.
apiVersion: v1
kind: Namespace
metadata:
  name: test-orchestrator-iperf2
  labels:
    # managed-by but no run-id: the namespace is shared by every iperf2 run, so a
    # run-scoped cleanup must never select it (ADR-05-02).
    app.kubernetes.io/managed-by: test-orchestrator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-orchestrator
  namespace: test-orchestrator-iperf2
  labels:
    app.kubernetes.io/managed-by: test-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: test-orchestrator
  labels:
    app.kubernetes.io/managed-by: test-orchestrator
rules:
  # Phase 3: discovery and explicit node resolution (M1-06).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: test-orchestrator
  labels:
    app.kubernetes.io/managed-by: test-orchestrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: test-orchestrator
subjects:
  - kind: ServiceAccount
    name: test-orchestrator
    namespace: test-orchestrator-iperf2
