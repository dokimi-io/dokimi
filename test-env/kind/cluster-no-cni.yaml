# kind without a CNI, for the Calico, Cilium and flannel profiles: test-env.sh installs
# the CNI once the nodes exist. Same shape as cluster.yaml; the nodes stay NotReady until
# the CNI is up.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: 10.244.0.0/16
nodes:
  - role: control-plane
  - role: worker
  - role: worker
  - role: worker
