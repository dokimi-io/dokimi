apiVersion: dokimi.io/v1alpha1
kind: NetworkTest

metadata:
  name: tcp-baseline

placement:
  mode: explicit
  source: dokimi-worker
  target: dokimi-worker2

test:
  type: iperf2
  protocol: tcp
  duration: 20s
  targetBandwidth: 10G

monitoring:
  mode: managed

validation:
  - metric: throughput
    comparison: atLeast
    threshold: 1
    unit: gigabits per second

results:
  directory: ./results
