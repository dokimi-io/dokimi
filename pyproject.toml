[project]
name = "dokimi"
version = "0.1.0"
description = "Test orchestration framework for functional and non-functional validation of Kubernetes clusters"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }

# The `kubernetes` distribution's major version tracks the Kubernetes minor it targets
# (36.x targets 1.36), so the floor of Kubernetes 1.35 is expressed as >=35.
# A literal ">=1.35" would be satisfied by every release ever published.
#
# The upper bound is there because a CLI installed from PyPI resolves its own dependencies:
# uv.lock doesn't reach it. kubernetes 37 validates every call's arguments and refuses the
# log stream's timeout of (connect, no read limit), so `submit` and `attach` crash while
# following a run. Until dokimi runs against 37, the CLI stays below it.
dependencies = [
    "kubernetes>=35,<37",
    # 6.0.3 is the floor, the newest release, chosen the same way as the Python,
    # kubernetes and Robot Framework floors below.
    "pyyaml>=6.0.3",
]

# Robot Framework is a runtime dependency of a *run*, not of the core
# library. Keeping it an extra is what lets CI install without it and prove
# the core still imports and passes its tests.
#
# 7.5 is the floor: the newest release at the time development started, chosen the same
# way as the Python and kubernetes floors. uv.lock pins the exact version the orchestrator
# image is built from and CI tests against. A CLI installed from PyPI doesn't read uv.lock:
# it resolves within these bounds, so they govern what a user actually runs.
[project.optional-dependencies]
robot = [
    "robotframework>=7.5",
]

[project.scripts]
dokimi = "dokimi.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dokimi"]

[tool.uv]
# 0.12.18 is the release that fixes GHSA-2cv4-cqwr-gwf7, a path-traversal weakness during
# wheel installation on Windows. Unlike the other version floors here, this one is chosen on
# security grounds rather than recency, so it is enforced rather than merely documented.
required-version = ">=0.12.18"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "images/iperf2/dokimi_iperf2_exporter.py", "test-env/acceptance.py"]

# The official `kubernetes` distribution ships no py.typed marker and no stubs, and the
# available third-party stubs lag its releases. Everything that touches it is confined to
# the two adapters, `k8s/_kubernetes.py` and `k8s/resources.py`, each behind a typed
# protocol, so the untyped surface stops there.
[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# The model has classes named TestDefinition and TestType, which pytest would
# otherwise try to collect as test classes. Every test here is a function.
python_classes = []
