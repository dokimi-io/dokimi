[project]
name = "test-orchestrator"
version = "0.1.0"
description = "Test orchestration framework for functional and non-functional validation of Kubernetes clusters"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }

# The `kubernetes` distribution's major version tracks the Kubernetes minor it targets
# (36.x targets 1.36), so "Kubernetes 1.35+" from ADR-01-02 is expressed as >=35.
# A literal ">=1.35" would be satisfied by every release ever published.
dependencies = [
    "kubernetes>=35",
]

# Robot Framework is a runtime dependency of a *run* (ADR-01-08), not of the core
# library (ADR-01-02). Keeping it an extra is what lets CI install without it and prove
# the core still imports and passes its tests.
#
# 7.5 is the floor: the newest release at the time development started, chosen the same
# way as the Python and kubernetes floors. uv.lock pins the exact version the CLI and the
# orchestrator image are both built from (ADR-05-08), so this bound governs what a
# consumer of the library may resolve, not what we ship.
[project.optional-dependencies]
robot = [
    "robotframework>=7.5",
]

[project.scripts]
test-orchestrator = "test_orchestrator.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_orchestrator"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
