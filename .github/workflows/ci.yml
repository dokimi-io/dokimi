name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # 0.12.18 addresses GHSA-2cv4-cqwr-gwf7, a path-traversal weakness during wheel
  # installation on Windows. These runners are Linux and unaffected, but the pin should not
  # tell a developer that an older uv is the supported one (ADR-01-09).
  UV_VERSION: "0.12.18"

jobs:
  quality:
    name: Lint, format and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      # The test environment's scripts and the iperf2 client script: shellcheck is
      # preinstalled on GitHub's Ubuntu runners.
      - name: Shell scripts
        run: shellcheck -x test-env/*.sh images/iperf2/*.sh

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest

  core-without-robot:
    name: Core library without Robot Framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # No extras: the `robot` extra carries Robot Framework, so this environment does
      # not have it. ADR-01-02 requires the core library to work anyway.
      - run: uv sync --locked

      # Deliberately not `import robot`: this repository has a `robot/` directory at
      # its root, which Python treats as a PEP 420 namespace package when Robot
      # Framework is absent, so the import succeeds and proves nothing. The installed
      # distribution is the thing to check.
      - name: Assert Robot Framework really is absent
        run: |
          if uv run python -c "import importlib.metadata as m; m.version('robotframework')" 2>/dev/null; then
            echo "Robot Framework is installed - this job cannot prove independence."
            exit 1
          fi
          echo "Robot Framework is not installed, as this job requires."

      - name: Core library imports and its tests pass
        run: uv run pytest

  image:
    name: Orchestrator image builds and runs as non-root
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Single architecture and no push: this job asks whether the image still builds
      # from the lockfile and still holds the properties ADR-05-08 and ADR-05-04 require.
      # The release workflow is what publishes, multi-arch and signed.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/orchestrator/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The entry point runs
        run: docker run --rm orchestrator:ci --version

      - name: The container is not root
        run: |
          uid="$(docker run --rm --entrypoint id orchestrator:ci -u)"
          if [ "$uid" = "0" ]; then
            echo "the orchestrator image runs as root; ADR-05-04 requires non-root."
            exit 1
          fi
          echo "runs as uid $uid."

      # Robot is a runtime dependency of a run's phase 6 (ADR-01-08), so unlike the CLI
      # distribution, this image must have it.
      - name: Robot Framework is present in the image
        run: |
          docker run --rm --entrypoint python orchestrator:ci \
            -c "import importlib.metadata as m; print('robotframework', m.version('robotframework'))"

  iperf2-image:
    name: iperf2 image builds, runs as non-root, and measures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/iperf2/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: iperf2:ci
          cache-from: type=gha,scope=iperf2
          cache-to: type=gha,mode=max,scope=iperf2

      - name: The container is not root
        run: |
          uid="$(docker run --rm iperf2:ci id -u)"
          if [ "$uid" = "0" ]; then
            echo "the iperf2 image runs as root; ADR-05-04 requires non-root."
            exit 1
          fi
          echo "runs as uid $uid."

      - name: The tool is iperf2, not iperf3
        run: |
          version="$(docker run --rm iperf2:ci sh -c 'iperf -v 2>&1 || true')"
          echo "$version"
          case "$version" in
            "iperf version 2."*) ;;
            *) echo "the image does not ship iperf2"; exit 1 ;;
          esac

      # The whole pod contract, without a cluster: the server listens, both readiness
      # probes pass with the exact commands the pod specs use, a trigger starts the idle
      # client, the client exits 0 having printed a CSV summary line, and the server's
      # results hold the measured connection, told apart from the warm-up by its port.
      - name: A client and a server measure over UDP
        run: |
          set -eu
          docker network create dokimi-ci
          docker run -d --name server --network dokimi-ci iperf2:ci \
            dokimi-iperf2-server --protocol udp --port 5001 --source-port 5102 \
            --warmup 1 --results /tmp
          docker run -d --name client --network dokimi-ci iperf2:ci \
            dokimi-iperf2-client --protocol udp --port 5001 --trigger-port 5101 \
            --source-port 5102 --warmup-source-port 5103 \
            --bandwidth 10000000 --duration 2 --warmup 1 --results /tmp

          probe() {
            for _ in $(seq 30); do
              if docker exec "$1" sh -c "netstat -ln | grep -q ':$2 '"; then return 0; fi
              sleep 1
            done
            echo "$1 never listened on $2"; docker logs "$1"; exit 1
          }
          probe server 5001
          probe client 5101

          address() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1"; }
          python3 - "$(address client)" "$(address server)" <<'PY_TRIGGER'
          import socket, sys
          with socket.create_connection((sys.argv[1], 5101), timeout=5) as connection:
              connection.sendall(f"{sys.argv[2]}\n".encode())
          PY_TRIGGER

          status="$(timeout 60 docker wait client)"
          docker logs client
          [ "$status" = "0" ] || { echo "client exited $status"; exit 1; }
          output="$(docker logs client 2>/dev/null)"
          printf '%s\n' "$output" | grep -Eq '^[0-9]{14}(\.[0-9]+)?,' \
            || { echo "no iperf -y C summary line in the client output"; exit 1; }

          reports="$(docker exec server cat /tmp/iperf2.csv)"
          printf '%s\n' "$reports"
          docker exec server grep -qx 'measurement_source_port=5102' /tmp/iperf2.meta \
            || { echo "the server's meta file does not name the measurement's port"; exit 1; }
          printf '%s\n' "$reports" | grep -Eq '^[0-9]{14}(\.[0-9]+)?,[0-9.]+,5102,' \
            || { echo "no server report for the measurement's source port 5102"; exit 1; }
          printf '%s\n' "$reports" | grep -Eq '^[0-9]{14}(\.[0-9]+)?,[0-9.]+,5103,' \
            || { echo "no server report for the warm-up's source port 5103"; exit 1; }

      # M1-10's acceptance criteria in the real image: each pod's exporter serves its own
      # view with every required label, and keeps serving after the tool has exited. The
      # client has exited by now; its results are copied out and served read-only, as the
      # pod's exporter container would serve them from the shared volume.
      - name: The exporter serves each pod's result after the tool has exited
        run: |
          set -eu
          labels() {
            printf '%s\n' -e DOKIMI_CLUSTER=ci -e DOKIMI_RUN_ID=20261013-120000-ci0000 \
              -e DOKIMI_TEST_ID=pair-001 -e DOKIMI_REPETITION=1 -e DOKIMI_TEST_TYPE=iperf2 \
              -e DOKIMI_SOURCE_NODE=node-a -e DOKIMI_TARGET_NODE=node-b \
              -e DOKIMI_SOURCE_POD=client -e DOKIMI_TARGET_POD=server -e DOKIMI_PROTOCOL=udp \
              -e "DOKIMI_POD_IP=$1"
          }
          address() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1"; }

          # shellcheck disable=SC2046 # one flag per line, deliberately
          docker exec -d $(labels "$(address server)") server \
            dokimi-iperf2-exporter --results /tmp --port 9101
          mkdir -p client-results
          docker cp client:/tmp/. client-results/
          # shellcheck disable=SC2046
          docker run -d --name client-exporter --network dokimi-ci --read-only \
            -v "$PWD/client-results:/results:ro" $(labels 10.0.0.2) iperf2:ci \
            dokimi-iperf2-exporter --results /results --port 9101

          scrape() {
            for _ in $(seq 20); do
              if docker exec "$1" python3 -c "import urllib.request,sys; sys.stdout.write(urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=2).read().decode())" >"$1.prom" 2>/dev/null \
                && grep -q '^dokimi_test_completed{' "$1.prom"; then
                cat "$1.prom"; return 0
              fi
              sleep 1
            done
            echo "$1 served no result"; cat "$1.prom" || true; exit 1
          }
          scrape server
          scrape client-exporter

          for pod in server client-exporter; do
            grep -Eq '^dokimi_test_completed\{.*\} 1$' "$pod.prom" \
              || { echo "$pod: the test is not complete"; exit 1; }
            grep -Eq '^dokimi_throughput_bits_per_second\{.*\} [0-9]' "$pod.prom" \
              || { echo "$pod: no throughput"; exit 1; }
            for label in cluster run_id test_id repetition test_type source_node target_node \
              source_pod target_pod source_ip target_ip protocol direction; do
              if grep '^dokimi_' "$pod.prom" | grep -v "[{,]$label=\"[^\"]\+\"" | grep -q .; then
                echo "$pod: a series without $label"; exit 1
              fi
            done
          done
          grep -Eq '^dokimi_packet_loss_percent\{.*direction="inbound".*\} ' server.prom \
            || { echo "the server reports no packet loss"; exit 1; }
          grep -Eq '^dokimi_jitter_seconds\{.*direction="inbound".*\} ' server.prom \
            || { echo "the server reports no jitter"; exit 1; }
          if grep -q '^dokimi_packet_loss_percent' client-exporter.prom; then
            echo "the client reports loss it cannot observe"; exit 1
          fi

      # The probe mode the run-level preflight starts the client in (ADR-05-07): the same
      # pod contract, ending in a report instead of a measurement, and an exit status that
      # names the failed check. Against the server above: a name Docker resolves passes, the
      # API server's name, which only a cluster resolves, is dns (68), and an address
      # nothing answers on is connectivity (69), within the client's own 15 s bound.
      - name: The client's probe mode tells connectivity from DNS
        run: |
          set -eu
          address() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$1"; }
          probe() {
            docker run -d --name "$1" --network dokimi-ci iperf2:ci \
              dokimi-iperf2-client --protocol udp --port 5001 --trigger-port 5101 \
              --source-port 5102 --warmup-source-port 5103 \
              --bandwidth 10000000 --duration 2 --warmup 1 --results /tmp \
              --probe-dns "$3" >/dev/null
            for _ in $(seq 30); do
              if docker exec "$1" sh -c "netstat -ln | grep -q ':5101 '"; then break; fi
              sleep 1
            done
            python3 - "$(address "$1")" "$2" <<'PY_TRIGGER'
          import socket, sys
          with socket.create_connection((sys.argv[1], 5101), timeout=5) as connection:
              connection.sendall(f"{sys.argv[2]}\n".encode())
          PY_TRIGGER
            status="$(timeout 60 docker wait "$1")"
            docker logs "$1" 2>&1 | sed "s/^/$1: /" >&2
            echo "$status"
          }
          expect() {
            [ "$2" = "$3" ] || { echo "$1: expected exit $3, got $2"; exit 1; }
            echo "$1: exit $2, as expected"
          }
          expect passes "$(probe probe-passes "$(address server)" server)" 0
          expect dns "$(probe probe-dns "$(address server)" kubernetes.default.svc)" 68
          expect connectivity "$(probe probe-connectivity 192.0.2.1 server)" 69

  prometheus-config:
    name: The managed Prometheus configuration is valid for its pinned image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked

      # The configuration is generated, so a typo in it is invisible until a real run's
      # Prometheus refuses to start. promtool from the very image a run deploys is the
      # parser that matters, for both shapes the configuration takes: with the cluster's
      # own supporting exporters, and with the node-exporter a run deploys itself.
      - name: promtool accepts the rendered configurations
        run: |
          mkdir -p "$RUNNER_TEMP/prometheus"
          uv run python - "$RUNNER_TEMP/prometheus" <<'PY'
          import sys
          from pathlib import Path

          from dokimi.metrics.managed import NodeExporter, SupportingExporter, render_config

          run_id, namespace = "20260101-100000-4f2a9c", "dokimi-iperf2"
          reused = [
              SupportingExporter("node-exporter", "monitoring", "node-exporter"),
              SupportingExporter("kube-state-metrics", "kube-system", "kube-state-metrics"),
          ]
          deployed = NodeExporter(namespace, f"run-{run_id}-node-exporter", run_id, True)
          directory = Path(sys.argv[1])
          (directory / "reused.yml").write_text(render_config(run_id, namespace, reused))
          (directory / "deployed.yml").write_text(render_config(run_id, namespace, (), deployed))
          PY
          image="$(uv run python -c 'from dokimi.metrics.managed import PROMETHEUS_IMAGE; print(PROMETHEUS_IMAGE)')"
          docker run --rm -v "$RUNNER_TEMP/prometheus:/config:ro" --entrypoint promtool \
            "$image" check config /config/reused.yml /config/deployed.yml
