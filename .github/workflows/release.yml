# Release: publish the images, then build the distribution that points at them.
#
# The order is the decision, not an implementation detail. A released CLI ships the
# digest of the orchestrator image built from its own commit, and pins every test-workload
# image by digest the same way, so by default it runs exactly the images it was released
# with. So the images are built and pushed first, their digests are written into the
# generated constants file, and only then is the distribution built. They cannot be
# released independently: a cost accepted on purpose.
#
# Every image dokimi builds is one entry in the `images` matrix. Adding one is that entry
# plus its `<NAME>_IMAGE_DIGEST` line in src/dokimi/_image_digest.py; the bake step below
# refuses a release where the two lists differ. Upstream images that are pinned in code
# (the managed Prometheus, the node-exporter) are not built here.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push and sign the images (off = build-only rehearsal)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # 0.12.18 fixes GHSA-2cv4-cqwr-gwf7 (Windows wheel-install path traversal) and is the
  # floor the project sets for uv, which `[tool.uv] required-version` enforces.
  UV_VERSION: "0.12.18"

jobs:
  plan:
    name: Decide whether this run publishes
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Decide whether this run publishes
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Build, publish, sign and attest the ${{ matrix.name }} image
    needs: plan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing and provenance attestation
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: orchestrator
            file: images/orchestrator/Dockerfile
            image: ghcr.io/dokimi-io/orchestrator
          - name: iperf2
            file: images/iperf2/Dockerfile
            image: ghcr.io/dokimi-io/iperf2
    env:
      IMAGE: ${{ matrix.image }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Tags exist for humans reading the registry. Nothing the CLI submits or deploys
      # resolves a tag: the reference baked into the release below is the digest this
      # step returns. A rehearsal exports the same build as an OCI archive instead of
      # pushing it: a build that is neither pushed nor exported has no digest at all, and
      # the bake and the check below need one to rehearse anything.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          outputs: ${{ env.PUBLISH == 'true' && 'type=registry' || format('type=oci,dest={0}/image.tar', runner.temp) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign the image
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      # GitHub stores build attestations only for public repositories on the org's plan.
      # A publish started by hand while the repository is still private skips it, so its
      # images can be tried before going public. A tag always attests: a release from a
      # private repository fails here rather than shipping without provenance.
      - name: Attest build provenance
        if: env.PUBLISH == 'true' && (github.event_name == 'push' || !github.event.repository.private)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A matrix job has one set of outputs, and the leg that finishes last overwrites the
      # others. So each leg hands its reference on as an artifact of its own instead.
      - name: Record the reference
        run: |
          mkdir -p digests
          echo "${IMAGE}@${DIGEST}" > "digests/${NAME}"
          echo "### ${NAME} image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          if-no-files-found: error

  distribution:
    name: Build the CLI distribution against those digests
    needs: [plan, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write       # attach the distribution to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # One constant per built image, by name: `iperf2` is IPERF2_IMAGE_DIGEST. An image
      # without its constant, or a constant no image fills, would ship a CLI that resolves
      # nothing for it, so either one stops the release here.
      - name: Bake the image digests into the distribution
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("src/dokimi/_image_digest.py")
          source = path.read_text()
          built = {
              file.name: file.read_text().strip()
              for file in sorted(pathlib.Path("digests").iterdir())
          }
          constants = set(
              re.findall(r"^([A-Z0-9_]+_IMAGE_DIGEST): str \| None = ", source, re.MULTILINE)
          )
          wanted = {f"{name.upper().replace('-', '_')}_IMAGE_DIGEST": name for name in built}
          if set(wanted) != constants:
              raise SystemExit(
                  f"built images {sorted(built)} and digest constants {sorted(constants)} "
                  f"in {path} do not match one to one"
              )
          for constant, name in sorted(wanted.items()):
              _, _, digest = built[name].partition("@")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"{name}: not a sha256 digest: {built[name]!r}")
              source, count = re.subn(
                  rf"^{constant}: str \| None = .*$",
                  f'{constant}: str | None = "{digest}"',
                  source,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"{path} no longer has the {constant} assignment to rewrite")
              print(f"{constant} = {digest}")
          path.write_text(source)
          PY

      # The promise at the top, checked rather than assumed: a released CLI resolves each
      # default image to the digest of the image built from this same commit, the way
      # `submit` resolves it with no override set.
      - name: Verify the baked-in defaults resolve to those digests
        run: |
          uv sync --locked
          uv run python - <<'PY'
          import pathlib

          from dokimi.images import ImageSource
          from dokimi.run_images import COMPONENTS, resolve_component

          for file in sorted(pathlib.Path("digests").iterdir()):
              name, expected = file.name, file.read_text().strip()
              image = resolve_component(COMPONENTS[name], env={})
              assert image is not None, f"{name} has no release default"
              assert image.reference == expected, f"{name}: {image.reference} != {expected}"
              assert image.source is ImageSource.RELEASE_DEFAULT
              print(f"{name} default resolves to {image.reference}")
          PY

      - run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution
          path: dist/

      # A tag push does not create a release on its own, so create one if the tag does
      # not have one yet. The image references go in the notes: the digest is the part
      # of a release someone actually needs when pinning it in a cluster.
      - name: Attach the distribution to the release
        if: github.event_name == 'push' && needs.plan.outputs.publish == 'true'
        run: |
          notes=""
          for file in digests/*; do
            notes="${notes}$(basename "$file") image: \`$(cat "$file")\`
          "
          done
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --notes "$notes"
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi:
    name: Publish the CLI to PyPI
    needs: [plan, distribution]
    # Only a release, a tag push, publishes. Trusted Publishing: PyPI accepts an upload from this
    # repository's release workflow, in this environment, and from nothing else, so no token is
    # stored anywhere. On PyPI the distribution is `dokimi-io`; `dokimi` there is another project.
    if: github.event_name == 'push' && needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/dokimi-io/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distribution
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
