# Release: publish the images, then build the distribution that points at them.
#
# The order is the decision, not an implementation detail. ADR-05-08 requires a released
# CLI to ship the digest of the orchestrator image built from its own commit, and
# ADR-05-04 pins every test-workload image by digest the same way. So the images are
# built and pushed first, their digests are written into the generated constants file,
# and only then is the distribution built. They cannot be released independently — that
# is a consequence ADR-05-08 accepts explicitly.
#
# Every image dokimi builds is one entry in the `images` matrix. Adding one is that entry
# plus its `<NAME>_IMAGE_DIGEST` line in src/dokimi/_image_digest.py; the bake step below
# refuses a release where the two lists differ. Upstream images that are pinned in code
# (the managed Prometheus, the node-exporter) are not built here.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Push and sign the images (off = build-only rehearsal)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # 0.12.18 fixes GHSA-2cv4-cqwr-gwf7 (Windows wheel-install path traversal) and is the
  # floor ADR-01-09 sets and `[tool.uv] required-version` enforces.
  UV_VERSION: "0.12.18"

jobs:
  plan:
    name: Decide whether this run publishes
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Decide whether this run publishes
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  images:
    name: Build, publish, sign and attest the ${{ matrix.name }} image
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write       # keyless cosign signing and provenance attestation
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: orchestrator
            file: images/orchestrator/Dockerfile
            image: ghcr.io/dokimi-io/orchestrator
          - name: iperf2
            file: images/iperf2/Dockerfile
            image: ghcr.io/dokimi-io/iperf2
    env:
      IMAGE: ${{ matrix.image }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long

      # Tags exist for humans reading the registry. Nothing the CLI submits or deploys
      # resolves a tag: the reference baked into the release below is the digest this
      # step returns.
      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Install cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign the image
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # A matrix job has one set of outputs, and the leg that finishes last overwrites the
      # others. So each leg hands its reference on as an artifact of its own instead.
      - name: Record the reference
        run: |
          mkdir -p digests
          echo "${IMAGE}@${DIGEST}" > "digests/${NAME}"
          echo "### ${NAME} image" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.name }}
          path: digests/${{ matrix.name }}
          if-no-files-found: error

  distribution:
    name: Build the CLI distribution against those digests
    needs: [plan, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # attach the distribution to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      # One constant per built image, by name: `iperf2` is IPERF2_IMAGE_DIGEST. An image
      # without its constant, or a constant no image fills, would ship a CLI that resolves
      # nothing for it, so either one stops the release here.
      - name: Bake the image digests into the distribution
        run: |
          python - <<'PY'
          import pathlib
          import re

          path = pathlib.Path("src/dokimi/_image_digest.py")
          source = path.read_text()
          built = {
              file.name: file.read_text().strip()
              for file in sorted(pathlib.Path("digests").iterdir())
          }
          constants = set(
              re.findall(r"^([A-Z0-9_]+_IMAGE_DIGEST): str \| None = ", source, re.MULTILINE)
          )
          wanted = {f"{name.upper().replace('-', '_')}_IMAGE_DIGEST": name for name in built}
          if set(wanted) != constants:
              raise SystemExit(
                  f"built images {sorted(built)} and digest constants {sorted(constants)} "
                  f"in {path} do not match one to one"
              )
          for constant, name in sorted(wanted.items()):
              _, _, digest = built[name].partition("@")
              if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                  raise SystemExit(f"{name}: not a sha256 digest: {built[name]!r}")
              source, count = re.subn(
                  rf"^{constant}: str \| None = .*$",
                  f'{constant}: str | None = "{digest}"',
                  source,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count != 1:
                  raise SystemExit(f"{path} no longer has the {constant} assignment to rewrite")
              print(f"{constant} = {digest}")
          path.write_text(source)
          PY

      # ADR-05-08's requirement, checked rather than assumed: a released CLI resolves each
      # default image to the digest of the image built from this same commit, the way
      # `submit` resolves it with no override set (ADR-04-08).
      - name: Verify the baked-in defaults resolve to those digests
        run: |
          uv sync --locked
          uv run python - <<'PY'
          import pathlib

          from dokimi.images import ImageSource
          from dokimi.run_images import COMPONENTS, resolve_component

          for file in sorted(pathlib.Path("digests").iterdir()):
              name, expected = file.name, file.read_text().strip()
              image = resolve_component(COMPONENTS[name], env={})
              assert image is not None, f"{name} has no release default"
              assert image.reference == expected, f"{name}: {image.reference} != {expected}"
              assert image.source is ImageSource.RELEASE_DEFAULT
              print(f"{name} default resolves to {image.reference}")
          PY

      - run: uv build

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distribution
          path: dist/

      # A tag push does not create a release on its own, so create one if the tag does
      # not have one yet. The image references go in the notes: the digest is the part
      # of a release someone actually needs when pinning it in a cluster.
      - name: Attach the distribution to the release
        if: github.event_name == 'push' && needs.plan.outputs.publish == 'true'
        run: |
          notes=""
          for file in digests/*; do
            notes="${notes}$(basename "$file") image: \`$(cat "$file")\`
          "
          done
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --notes "$notes"
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
